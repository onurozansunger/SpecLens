[project]
name = "speclens"
version = "0.1.0"
description = "Local evidence-grounded technical document analysis on Apple Silicon"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pdfplumber==0.11.10",
  "pypdfium2==5.14.0",
  "numpy>=2,<3",
  "rank-bm25==0.2.2",
  "pint>=0.24,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
ml = ["sentence-transformers==6.2.0", "torch==2.15.0"]

[tool.uv]
default-groups = ["dev", "ml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
speclens = "speclens.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
