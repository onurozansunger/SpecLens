name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
      - run: uv sync --locked --no-default-groups --group dev
      - run: uv run --no-sync ruff check src scripts tests
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python scripts/check_release.py
      # This job deliberately does not claim to validate Metal or model quality.
